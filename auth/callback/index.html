<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="genesis-id-origin" content="https://id.genesisframeworks.com">
    <meta name="genesis-id-app-id" content="genesis-editor">
    <meta name="genesis-id-callback-path" content="/auth/callback/">
    <title>Connecting Genesis ID — Genesis Editor</title>
    <link rel="stylesheet" href="/genesis-id.css?v=r-09bfffa74eadf02c">
    <style>
        :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #24202d; background: #f3f0fa; }
        main { width: min(28rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #e2daef; border-radius: 1.5rem; background: #fff; box-shadow: 0 1.25rem 4rem rgba(47, 36, 67, 0.14); text-align: center; }
        h1 { margin: 0; font-size: 1.35rem; }
        p { margin: 0.75rem 0 0; color: #666170; line-height: 1.55; }
        a { display: none; margin-top: 1.2rem; color: #6d28d9; font-weight: 700; }
        main[data-state="error"] a { display: inline-block; }
    </style>
    <link rel="stylesheet" href="/stage-theme.css?v=r-09bfffa74eadf02c">
    <!-- BRAND-ICONS:start -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=brand-d405d5cd5fd11553">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=brand-d405d5cd5fd11553">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=brand-d405d5cd5fd11553">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=brand-d405d5cd5fd11553">
    <link rel="manifest" href="/manifest.webmanifest?v=brand-d405d5cd5fd11553">
    <!-- BRAND-ICONS:end -->
</head>
<body class="immersive-stage stage-callback">
    <main id="callback-status" aria-live="polite">
        <h1>Connecting Genesis ID</h1>
        <p>Verifying the one-time connection code.</p>
        <a href="/">Back to Genesis Editor</a>
    </main>
    <script src="/genesis-id.js?v=r-09bfffa74eadf02c"></script>
    <script>
        (async () => {
            const status = document.getElementById('callback-status');
            try {
                const returnTo = await window.GenesisId.completeCallback();
                window.location.replace(returnTo);
            } catch (error) {
                status.dataset.state = 'error';
                status.querySelector('h1').textContent = 'Could not connect Genesis ID';
                status.querySelector('p').textContent = error instanceof Error
                    ? error.message
                    : 'The connection request expired. Please try again.';
            }
        })();
    </script>
</body>
</html>
